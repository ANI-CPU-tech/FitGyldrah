services:
  db:
    image: postgres:15-alpine
    container_name: fitgyldrah_db
    restart: always
    env_file:
      - .env
    ports:
      - "5439:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ADDED: Redis broker for Celery
  redis:
    image: redis:7-alpine
    container_name: fitgyldrah_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: fitgyldrah_backend
    restart: always
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # ADDED: Celery worker service
  celery:
    build: ./backend
    container_name: fitgyldrah_celery
    restart: always
    # NOTE: Change 'backend' here to whatever folder contains your celery.py
    command: celery -A backend worker -l info
    volumes:
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build: ./frontend
    container_name: fitgyldrah_frontend
    restart: always
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - WATCHPACK_POLLING=true
    depends_on:
      - backend

volumes:
  postgres_data:
